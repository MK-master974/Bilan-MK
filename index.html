<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style><title>Parcours Bilan Kiné</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1F4E79"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Bilan Kiné"><meta name="apple-mobile-web-app-status-bar-style" content="default"></head><body><title>Parcours Bilan Kiné</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:opsz,wght@7..72,500;7..72,650&display=swap">
<style>
/* Layout : barre d'étapes en haut, sommaire pilotable à gauche, bilan déroulant au centre — pensé tablette d'abord. */
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --surface-2:#F6F8FB; --ink:#16202B; --muted:#566476; --line:#D3DCE6; --line-2:#B9C6D4;
  --navy:#1F4E79; --navy-ink:#FFFFFF; --navy-soft:#E2EBF5; --navy-deep:#163A5C;
  --amber:#9A5B00; --amber-soft:#FFF1D6; --amber-line:#F0C97A;
  --green:#1F6E43; --green-soft:#E1F2E7; --red:#A8271B; --red-soft:#FCE8E6; --red-line:#F1B0A8;
  --focus:#2F7BD0;
  --f-ui:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --f-doc:"Literata", Georgia, "Times New Roman", serif;
  --r:10px; --r-sm:7px; --tap:46px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E141B; --surface:#16202A; --surface-2:#1B2733; --ink:#E5ECF3; --muted:#9AAABB; --line:#2A3746; --line-2:#3B4B5D;
  --navy:#8DB8E6; --navy-ink:#0E1A27; --navy-soft:#1D2D3E; --navy-deep:#B9D4F0;
  --amber:#F2B95C; --amber-soft:#33270F; --amber-line:#6B4E1C;
  --green:#7CCB98; --green-soft:#16301F; --red:#F29086; --red-soft:#3A1B18; --red-line:#6E2F28; --focus:#8DB8E6; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#16202A; --surface-2:#1B2733; --ink:#E5ECF3; --muted:#9AAABB; --line:#2A3746; --line-2:#3B4B5D;
  --navy:#8DB8E6; --navy-ink:#0E1A27; --navy-soft:#1D2D3E; --navy-deep:#B9D4F0;
  --amber:#F2B95C; --amber-soft:#33270F; --amber-line:#6B4E1C;
  --green:#7CCB98; --green-soft:#16301F; --red:#F29086; --red-soft:#3A1B18; --red-line:#6E2F28; --focus:#8DB8E6; color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.45 var(--f-ui);-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---------- Barre du haut ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.top-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font:650 18px/1 var(--f-doc);color:var(--navy);letter-spacing:.2px;white-space:nowrap}
.who{display:flex;flex-direction:column;min-width:0;flex:1}
.who b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{min-height:40px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);display:inline-flex;align-items:center;gap:6px;font-size:15px;white-space:nowrap}
.tbtn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink);font-weight:700}
.tbtn.ghost{border-color:transparent;background:transparent}
.acts{display:contents}
.menu-toggle{display:none}
@media (max-width:980px){
  .top .brand{display:none}
  .menu-toggle{display:inline-flex}
  .acts{display:none}
  .top.menu-open .acts{display:flex;flex-basis:100%;gap:8px;flex-wrap:wrap}
}
@media (max-width:700px){ .who{flex:1 1 calc(100% - 140px)} }
.steps{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.step .dot{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.step.done .dot{background:var(--green)}
.step.flag .dot{background:var(--amber)}
.step.on{background:var(--navy);border-color:var(--navy);color:var(--navy-ink);font-weight:700}
.step.on .dot{background:var(--navy-ink)}

/* ---------- Structure ---------- */
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px;max-width:1500px;margin:0 auto}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);max-height:calc(100vh - 130px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.main{min-width:0;display:flex;flex-direction:column;gap:14px}
.toc-toggle{display:none}
@media (max-width:980px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .toc{position:fixed;z-index:40;top:0;bottom:0;left:0;width:min(340px,88vw);max-height:none;border-radius:0 var(--r) var(--r) 0;
    padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-left:max(10px,env(safe-area-inset-left,0px));transform:translateX(-105%);transition:transform .2s ease;box-shadow:0 0 0 100vmax rgba(0,0,0,0)}
  .toc.open{transform:none;box-shadow:0 0 0 100vmax rgba(8,14,20,.45)}
  .toc-toggle{display:inline-flex}
}
@media (prefers-reduced-motion:reduce){.toc{transition:none}}

/* ---------- Sommaire ---------- */
.toc-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 6px 8px}
.toc-h b{font:650 16px/1.2 var(--f-doc);color:var(--navy)}
.toc-acts{display:flex;gap:6px;flex-wrap:wrap;padding:0 4px 8px}
.chipbtn{min-height:34px;padding:0 10px;display:inline-flex;align-items:center;border-radius:999px;border:1px solid var(--line-2);background:var(--surface-2);font-size:13px}
.toc-stage{margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
.toc-stage>button{width:100%;text-align:left;border:0;background:none;padding:8px 6px;font-weight:700;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;display:flex;justify-content:space-between}
.toc-stage.cur>button{color:var(--navy)}
.trow{display:flex;align-items:stretch;gap:4px;border-radius:var(--r-sm)}
.trow+.trow{margin-top:2px}
.trow .go{flex:1;min-width:0;min-height:44px;text-align:left;border:0;background:none;border-radius:var(--r-sm);padding:6px 8px;display:grid;grid-template-columns:18px 1fr;column-gap:8px;align-items:center}
.trow .go:hover{background:var(--surface-2)}
.trow.cur .go{background:var(--navy-soft)}
.trow .ic{width:12px;height:12px;border-radius:50%;border:2px solid var(--line-2);justify-self:center}
.trow.st-open .ic{border-color:var(--navy);background:var(--surface)}
.trow.st-auto .ic{border-color:var(--amber);background:var(--amber)}
.trow.st-done .ic{border-color:var(--green);background:var(--green)}
.trow.st-off .go{color:var(--muted)}
.trow.st-off .ic{border-style:dashed}
.trow.st-na .go{color:var(--muted);opacity:.6}
.trow .t{font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.trow .why{grid-column:2;font-size:12.5px;color:var(--amber);line-height:1.25}
.trow.st-na .why{color:var(--muted)}
.deep{flex:none;align-self:center;min-height:34px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;font-size:12.5px;padding:0 10px;color:var(--navy);font-weight:600;white-space:nowrap}
.deep:hover{background:var(--navy-soft)}
.deep.on{background:var(--navy);border-color:var(--navy);color:var(--navy-ink);font-weight:700}
.toc-stage .cnt{font-weight:600;text-transform:none;letter-spacing:0;font-size:12.5px}
.toc-legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:10px 6px 2px;font-size:12px;color:var(--muted)}
.toc-legend span{display:inline-flex;align-items:center;gap:5px}
.lg{width:10px;height:10px;border-radius:50%;border:2px solid var(--line-2);display:inline-block}
.lg.a{background:var(--amber);border-color:var(--amber)}.lg.d{background:var(--green);border-color:var(--green)}.lg.o{border-color:var(--navy)}.lg.f{border-style:dashed}

/* ---------- Sections ---------- */
.banner{border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;font-size:15px}
.banner.info{background:var(--navy-soft);color:var(--navy-deep)}
.banner.warn{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-line)}
.banner.alert{background:var(--red-soft);color:var(--red);border:1px solid var(--red-line)}
.banner .grow{flex:1;min-width:200px}
.stage-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:4px 2px}
.stage-h h1{font:650 26px/1.15 var(--f-doc);color:var(--ink)}
.stage-h p{margin:4px 0 0;color:var(--muted);font-size:15px;max-width:70ch}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);scroll-margin-top:130px}
.sec.auto{border-color:var(--amber-line)}
.sec-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.num{min-width:28px;height:28px;border-radius:7px;background:var(--navy);color:var(--navy-ink);font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.sec.module .num{background:var(--amber);color:var(--surface)}
.sec-h h2{font-size:18px;font-weight:700;flex:1;min-width:160px}
.why-chip{font-size:13px;border-radius:999px;padding:4px 10px;background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-line)}
.sec-acts{display:flex;gap:6px}
.sbtn{min-height:38px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);font-size:14px}
.sbtn.on{background:var(--navy);border-color:var(--navy);color:var(--navy-ink);font-weight:700}
.sec-b{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px 22px;align-items:start}
.sec-b .full{grid-column:1/-1}
.deep-div{grid-column:1/-1;display:flex;align-items:center;gap:10px;color:var(--navy);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.7px}
.deep-div::after{content:"";flex:1;height:1px;background:var(--line)}
.more{grid-column:1/-1;justify-self:start;min-height:42px;border:1px dashed var(--line-2);background:var(--surface-2);border-radius:var(--r-sm);padding:0 14px;color:var(--navy);font-size:15px}

/* ---------- Champs ---------- */
.it{display:flex;flex-direction:column;gap:6px;min-width:0}
.it>label,.it>.lab{font-size:15px;font-weight:700;color:var(--ink)}
.it .hint{font-size:13px;color:var(--muted);font-weight:400}
.subt{grid-column:1/-1;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-top:4px}
.note{grid-column:1/-1;font-size:14px;color:var(--muted);font-style:italic}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.opt{min-height:var(--tap);padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);font-size:15px;line-height:1.15;text-align:left}
.opt.on{background:var(--navy);border-color:var(--navy);color:var(--navy-ink);font-weight:700}
.opt.sm{min-height:38px;padding:0 10px;font-size:14px}
.opt.pos.on{background:var(--red);border-color:var(--red);color:var(--surface)}
.opt.neg.on{background:var(--green);border-color:var(--green);color:var(--surface)}
.opt.pre{border-style:dashed;border-color:var(--amber)}
.in{min-height:var(--tap);border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);padding:0 12px;width:100%}
textarea.in{min-height:86px;padding:10px 12px;resize:vertical}
.in.nb{width:92px;text-align:center}
.unit{font-size:14px;color:var(--muted)}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.side{display:inline-flex;align-items:center;gap:6px}
.side>i{font-style:normal;font-weight:700;font-size:13px;color:var(--muted);width:16px;text-align:center}
.calc{font-size:14px;border-radius:999px;padding:4px 10px;background:var(--navy-soft);color:var(--navy-deep);font-weight:700}
.calc.warn{background:var(--amber-soft);color:var(--amber)}
.calc.bad{background:var(--red-soft);color:var(--red)}
.calc.ok{background:var(--green-soft);color:var(--green)}
.calc.na{background:var(--surface-2);color:var(--muted);border:1px solid var(--line);font-weight:600}
.auto-tag{font-size:12px;color:var(--amber);font-weight:700}
.mobg{display:grid;grid-template-columns:auto repeat(2,minmax(64px,92px));gap:6px 8px;align-items:center}
.mobg .hd{font-size:12px;color:var(--muted);font-weight:700;text-align:center;text-transform:uppercase}

/* ---------- Cartes d'hypothèses ---------- */
.cards{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:12px;display:flex;flex-direction:column;gap:10px}
.card.sugg{border-color:var(--amber-line)}
.card-h{display:flex;gap:8px;align-items:center}
.card-h .lt{width:28px;height:28px;border-radius:50%;background:var(--navy);color:var(--navy-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.card-h h3{font-size:16px;flex:1}
.trow2{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px}
.trow2 .l{font-size:15px;flex:1;min-width:140px}
.der{display:flex;justify-content:space-between;gap:8px;font-size:14px;border-top:1px solid var(--line);padding-top:8px}
.der b{white-space:nowrap}
.rule{font-size:13.5px;color:var(--muted);line-height:1.35}
.rule b{color:var(--ink)}
.addhyp{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.addhyp .lab{font-size:14px;color:var(--muted);margin-right:4px}

/* ---------- Schéma corporel ---------- */
.body{position:relative;max-width:420px;width:100%;aspect-ratio:394/406;justify-self:start}
.body img{width:100%;height:100%;display:block;filter:var(--sil-filter,none)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .body img{filter:invert(.88) hue-rotate(180deg);mix-blend-mode:lighten}}
:root[data-theme="dark"] .body img{filter:invert(.88) hue-rotate(180deg);mix-blend-mode:lighten}
.zone{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid var(--navy);background:color-mix(in srgb,var(--surface) 55%,transparent);padding:0}
.zone.on{background:var(--red);border-color:var(--red)}
.zone span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Mode patient ---------- */
.pmode{min-height:100%;display:flex;flex-direction:column;align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px;background:var(--bg)}
.pcard{width:100%;max-width:760px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;gap:20px}
.pbar{width:100%;max-width:760px;height:8px;border-radius:99px;background:var(--line);margin-bottom:16px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--navy);border-radius:99px}
.pcard h1{font:650 30px/1.15 var(--f-doc)}
.pcard .lead{font-size:19px;color:var(--muted);margin:0}
.pcard .it>label,.pcard .it>.lab{font-size:19px}
.pcard .opt{min-height:56px;font-size:18px;padding:0 18px}
.pcard .in{min-height:56px;font-size:18px}
.pnav{display:flex;justify-content:space-between;gap:12px;width:100%;max-width:760px;margin-top:16px}
.pnav button{min-height:58px;padding:0 26px;font-size:18px;border-radius:12px}
.hold{position:relative;overflow:hidden}
.hold i{position:absolute;left:0;bottom:0;height:4px;background:var(--navy);width:0}

/* ---------- Compte-rendu ---------- */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px 30px;font:400 16px/1.55 var(--f-doc);max-width:900px}
.doc h1{font:650 26px/1.2 var(--f-doc);margin-bottom:4px}
.doc h2{font:650 18px/1.3 var(--f-doc);color:var(--navy);margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.doc h3{font:650 15px/1.3 var(--f-doc);margin:12px 0 4px}
.doc .meta{color:var(--muted);font-size:14px}
.doc dl{display:grid;grid-template-columns:minmax(150px,34%) 1fr;gap:4px 14px;margin:0}
.doc dt{color:var(--muted);font-size:14.5px}
.doc dd{margin:0}
.doc p{margin:6px 0}
.export{display:flex;flex-wrap:wrap;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:999px;font-size:15px;z-index:60;max-width:calc(100vw - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- v2 : accueil, dossiers, réévaluation ---------- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tbtn[disabled]{opacity:.45;cursor:default}
.bsel{min-height:40px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);padding:0 10px;font-size:15px;max-width:260px}
.confirm-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;padding:10px 12px;border-radius:var(--r);background:var(--amber-soft);border:1px solid var(--amber-line);color:var(--ink);font-size:15px}
.confirm-bar span{flex:1 1 260px}
.scrim{position:fixed;inset:0;z-index:35}
.toc-stage .new{font-size:11.5px;text-transform:none;letter-spacing:0;background:var(--amber);color:var(--surface);border-radius:999px;padding:1px 7px;margin-left:4px}
.sbtn.danger{background:var(--red);border-color:var(--red);color:var(--surface);font-weight:700}
.sbtn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.sbtn.act{justify-self:start;color:var(--navy);border-style:dashed}
.sbtn.fold{color:var(--muted)}
.sec.folded .sec-h{border-bottom:0}
.sec-sum{display:block;width:100%;text-align:left;border:0;background:none;padding:0 14px 12px 52px;color:var(--muted);font-size:14px;line-height:1.4}
.j0{display:inline-block;font-size:12.5px;font-weight:600;color:var(--navy-deep);background:var(--navy-soft);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}
.gate{font-size:14px;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:var(--r-sm);padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.opt.xs{min-height:36px;min-width:36px;padding:0 8px;font-size:14px;text-align:center}
.opt.sc{min-width:44px;text-align:center}

/* ---------- Restrictions cumulées : la plus tardive l'emporte ---------- */
function restrOp(o, key, dated) {
  const ligs = [OP.lcp, OP.lfpm, OP.lig, OP.osteo];
  switch (key) {
    case 'hop':
      if ([OP.ptg, OP.uni].includes(o)) return { never: true, why: 'prothèse : tests de saut non indiqués' };
      if (o === OP.lca) {
        const r = dated(16, 'ligamentoplastie LCA : 16 semaines et critères de course réunis', { src: SRC_LCA }); if (r) return r;
        const rc = critState(runCritList()); return rc.all ? null : { crit: true, why: `critères de course ${rc.miss.length ? 'non réunis (' + rc.miss.join(', ') + ')' : 'à compléter'}${rc.unk.length ? ` · à mesurer : ${rc.unk.join(', ')}` : ''}`, src: SRC_LCA };
      }
      if (o === OP.sut) return dated(16, 'suture méniscale : 16 semaines', { src: SRC_MEN });
      if (o === OP.mnx) return dated(6, 'méniscectomie : 6 semaines et étapes fonctionnelles validées', { src: SRC_MEN });
      if (ligs.includes(o)) return dated(16, `${opShort(o)} : 16 semaines`, { unsourced: true });
      return dated(12, `${opShort(o)} : 12 semaines`, { unsourced: true });
    case 'squat1':
      if (o === OP.lca) { const sc = critState(squatCritList()); return sc.all ? null : { crit: true, why: `squat unipodal : critères ${sc.miss.length ? 'non réunis (' + sc.miss.join(', ') + ')' : 'à compléter'}${sc.unk.length ? ` · à mesurer : ${sc.unk.join(', ')}` : ''}`, src: 'Aspetar 2023' }; }
      if (o === OP.sut) return dated(16, 'suture méniscale : squat unipodal profond', { src: SRC_MEN });
      return dated(8, `${opShort(o)} : 8 semaines`, { unsourced: true });
    case 'lig':
      if ([OP.ptg, OP.uni].includes(o)) return { never: true, why: 'prothèse : stabilité évaluée par le chirurgien' };
      if (o === OP.lca) return dated(0, 'tests de laxité réservés à l\'évaluation du retour au sport, à coordonner avec le chirurgien', { months: 9, src: 'Rev Méd Liège 2025' });
      if ([OP.lcp, OP.lig].includes(o)) return dated(0, `${opShort(o)} : tests de laxité à coordonner avec le chirurgien`, { months: 9, unsourced: true });
      return null;
    case 'men':
      if ([OP.ptg, OP.uni].includes(o)) return { never: true, why: 'prothèse : hypothèse méniscale sans objet' };
      if (o === OP.sut) return dated(16, 'suture méniscale : McMurray, Thessaly, flexion forcée', { src: SRC_MEN });
      if (o === OP.lca) return hasOp(OP.sut) ? null : dated(12, 'ligamentoplastie LCA sans suture méniscale', { unsourced: true });
      return dated(12, `${opShort(o)} : tests méniscaux en charge ou en flexion forcée`, { unsourced: true });
    case 'ifp': return dated(12, o === OP.lfpm ? 'reconstruction du LFPM : tests d\'appréhension' : `${opShort(o)} : tests d'appréhension`, { unsourced: true });
    case 'oa': return [OP.ptg, OP.uni].includes(o) ? { never: true, why: 'prothèse : hypothèse sans objet' } : null;
  }
  return null;
}
function restr(key) {
  if (!isPostop()) return null;
  const known = !!parseD(A('po_date'));
  const dated = (weeks, why, o = {}) => { if (!known) return { why: 'date d\'intervention inconnue : vérifier le protocole du chirurgien', nodate: true }; const u = poAt(weeks, o.months); return stillBefore(u) ? { until: u, why, ...o } : null; };
  const ops = opsList().length ? opsList() : [OP.autre];
  const rs = ops.map(o => restrOp(o, key, dated)).filter(Boolean);
  if (!rs.length) return null;
  const nev = rs.find(r => r.never); if (nev) return nev;
  const nd = rs.find(r => r.nodate); if (nd) return nd;
  const dts = rs.filter(r => r.until).sort((a, b) => b.until.localeCompare(a.until));
  const main = dts[0] || rs[0];
  const others = rs.filter(r => r !== main && r.why !== main.why);
  return others.length ? { ...main, why: `${main.why} ; aussi : ${others.map(r => r.until ? `${r.why} (jusqu'au ${fmtD(r.until)})` : r.why).join(' ; ')}` } : main;
}

  switch (it.t) {
    case 'mc': return v.map(x => x === 'Autre' ? `autre (${S.a[it.id + '_autre'] || 'à préciser'})` : x).join(', ');
    case 'gd': { const r = sides(v, it); return r ? r + u : null; }
    case 'tst': return ['g', 'd'].filter(k => v[k]).map(k => `${SIDE[k]} ${pm(v[k])}`).join(' · ') || null;
    case 'palp': return ['g', 'd'].filter(k => v[k]).map(k => `${SIDE[k]} ${v[k] === '+' ? 'reproduit la douleur' : 'indolore'}`).join(' · ');
    case 'gds': return sides(v, it) || null;
    case 'mob': { const part = (pre, lb) => { const r = ['g', 'd'].filter(k => filled(v[pre + k])).map(k => `${SIDE[k]} ${v[pre + k]}${sainTag(it, pre + k)}`).join(' / '); return r ? `${lb} ${r}` : ''; };
      return [part('a', 'actif'), part('p', 'passif'), v.rg || v.rd ? `reproduit la douleur ${[v.rg && 'G', v.rd && 'D'].filter(Boolean).join(' et ')}` : ''].filter(Boolean).join(' · ') || null; }
    case 'arth': return [['gr', 'raideur G'], ['gp', 'reproduit la douleur G'], ['dr', 'raideur D'], ['dp', 'reproduit la douleur D']].filter(([k]) => v[k]).map(([, l]) => l).join(', ');
    case 'date': return fmtD(v);
    case 'scale': return v + ' / 10';
    case 'yn': case 'ch': case 'proc': return String(v);
    default: return String(v) + u;
  }
}
function fmt(it, v) {
  const r = fmtRaw(it, v); if (r == null) return null;
  const c = (it.t === 'gd' ? gdCalc(it) : it.t === 'mob' ? mobCalc(it) : '').replace(/<[^>]+>/g, '');
  return c ? `${r} (${c})` : r;
}

/* ---------- Rendu des champs ---------- */
function opt(id, v, cur, cls = '', a = 'set', k = '') {
  const on = cur === v || (Array.isArray(cur) && cur.includes(v));
  const pre = on && isPre(id) ? ' pre' : '';
  return `<button type="button" class="opt ${cls}${on ? ' on' : ''}${pre}" data-act="${a}" data-id="${id}" data-v="${esc(v)}"${k ? ` data-k="${k}"` : ''} aria-pressed="${on}">${esc(v)}</button>`;
}
function j0chip(it) {
  if (!isReeval() || !it.sec || !['douleur', 'bilan'].includes(SEC[it.sec].stage) || ['txt', 'area', 'date', 'custom', 'calc', 'act'].includes(it.t)) return '';
  const r = REF(); if (!r || !meaningful(r.a[it.id])) return '';
  if (['ch', 'yn', 'mc', 'proc', 'tst', 'palp', 'gds', 'arth'].includes(it.t) && JSON.stringify(r.a[it.id]) === JSON.stringify(S.a[it.id])) return '';
  const v = withBilan(r, () => fmtRaw(ITEMS[it.id] || it, r.a[it.id]));
  return v ? ` <span class="j0">J0 : ${esc(v)}</span>` : '';
}
function lab(it, p) {
  const h = p ? '' : (it.hintf ? it.hintf(S) : it.hint);
  const l = p && it.pl ? it.pl : itl(it);
  return `<span class="lab">${esc(l)}${!p && isPre(it.id) ? ' <span class="auto-tag">· pré-rempli</span>' : ''}${p ? '' : j0chip(it)}${h ? `<br><span class="hint">${esc(h)}</span>` : ''}</span>`;
}
function tstCtl(id, o, labels = ['+', '−'], aria = ['positif', 'négatif']) {
  return `<div class="hrow">` + ['g', 'd'].map(k => `<span class="side"><i>${k.toUpperCase()}</i><span class="seg">` +
    `<button type="button" class="opt sm pos${o[k] === '+' ? ' on' : ''}" data-act="setk" data-id="${id}" data-k="${k}" data-v="+" aria-label="${k === 'g' ? 'Gauche' : 'Droit'} ${aria[0]}" aria-pressed="${o[k] === '+'}">${labels[0]}</button>` +
    `<button type="button" class="opt sm neg${o[k] === '-' ? ' on' : ''}" data-act="setk" data-id="${id}" data-k="${k}" data-v="-" aria-label="${k === 'g' ? 'Gauche' : 'Droit'} ${aria[1]}" aria-pressed="${o[k] === '-'}">${labels[1]}</button></span></span>`).join('') + '</div>';
}
function itemHTML(it, p = false) {
  if (it.t === 'sub') return `<div class="subt">${esc(it.l)}</div>`;
  if (it.t === 'note') return `<div class="note">${esc(it.l)}</div>`;
  const hid = it.if && !it.if(S) ? ' hidden' : '';
  const full = it.full || ['area', 'mob'].includes(it.t) ? ' full' : '';
  const rdis = !p && it.rk && rActive(it.rk);

  const v = A(it.id);

  switch (it.t) {

    case 'mc': { const o = [...it.o], ni = o.findIndex(x => NONE.includes(x)), ins = [...(it.dk ? ['Je ne sais pas'] : []), ...(it.other ? ['Autre'] : [])];
      if (ni >= 0) o.splice(ni, 0, ...ins); else o.push(...ins);

      return wrap(lab(it, p) + `<div class="seg">${o.map(x => opt(it.id, x, v, '', 'tog')).join('')}</div>` +

    case 'proc': return wrap(`<span class="lab">${esc(it.l)}${J}</span><div class="seg">${['Mieux', 'Idem', 'Pire'].map(o => opt(it.id, o, v, 'sm')).join('')}</div>`);

    case 'txt': {

    case 'palp': return wrap(`<span class="lab">${esc(it.l)}${J}</span>` + tstCtl(it.id, v || {}, ['Reproduit la douleur', 'Indolore'], ['reproduit la douleur', 'indolore']));
    case 'gds': { const o = v || {}; return wrap(`<span class="lab">${esc(it.l)}${J}</span><div class="hrow">` +
      ['g', 'd'].map(k => `<span class="side"><i>${k.toUpperCase()}</i><span class="seg">${it.o.map(x => `<button type="button" class="opt sm${o[k] === x ? ' on' : ''}" data-act="setk" data-id="${it.id}" data-k="${k}" data-v="${esc(x)}" aria-pressed="${o[k] === x}">${esc(x)}</button>`).join('')}</span></span>`).join('') + '</div>'); }
    case 'mob': { const o = v || {}; const inp = k => `<input class="in nb${isSainPre(it.id, k) ? ' pre' : ''}" inputmode="decimal" aria-label="${esc(it.l)} ${k}" id="f-${it.id}-${k}" data-id="${it.id}" data-k="${k}" value="${esc(o[k])}"${isSainPre(it.id, k) ? ' title="Côté sain repris du bilan précédent"' : ''}>`;

  }
  return '';
